<!DOCTYPE html>
<html>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width,initial-scale=1'>
        <title>BusCMR - Login</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel='stylesheet' href='css/style.css'>
    </head>
    <body>
        <div class='container'>

        </div>
        <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusCMR - Login</title>
    <!-- Font Awesome for Input Icons -->
</head>
<body class="auth-body">

    <!-- Form Card Centered on Screen -->
    <div class="card auth-card">
        <!-- Logo Section -->
        <div class="brand-logo">
            <h1>Bus<span>CMR</span></h1>
            <p class="tagline">Book. Travel. Arrive.</p>
        </div>

        <!-- Header -->
        <div class="auth-header">
            <h2 class="page-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>
        </div>

        <!-- Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope field-icon"></i>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                </div>
            </div>

            <div class="form-options">
                <div class="form-checkbox">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" class="link-bold">Sign up</a></p>
            </div>
        </form>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const users = JSON.parse(localStorage.getItem('buscmr_users')) || [];
            const validUser = users.find(u => u.email === email && u.password === password);

            if (validUser) {
                localStorage.setItem('buscmr_currentUser', JSON.stringify(validUser));
                alert("Login successful! Redirecting to Dashboard...");
                window.location.href = "index.html";
            } else {
                alert("Invalid email or password. Please try again.");
            }
        }
    </script>
    <script src='js/login.js'></script>

</body>
</html>
