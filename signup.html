<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusCMR - Sign Up & Sign In</title>
  <link rel="stylesheet" href="sign up.css">
</head>
<body>
  <div class="auth-wrapper">
    <!-- Sign In Card -->
    <div class="auth-card" id="signin-card" style="display: none;">
      <div class="logo text-center">Bus<span>CMR</span><small>Book. Travel. Arrive.</small></div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your account</p>

      <form id="signin-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <span class="icon-left">✉️</span>
            <input type="email" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <span class="icon-left">🔒</span>
            <input type="password" id="signin-pass" placeholder="Enter your password" required>
            <span class="toggle-pw" onclick="togglePassword('signin-pass')">👁️</span>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary btn-block">Sign In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="#" id="switch-to-signup">Sign up</a></p>
    </div>

    <!-- Create Account Card -->
    <div class="auth-card" id="signup-card">
      <div class="logo text-center">Bus<span>CMR</span><small>Book. Travel. Arrive.</small></div>
      <h2>Create Your Account</h2>
      <p class="subtitle">Sign up to get started with BusCMR</p>

      <form id="signup-form">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <span class="icon-left">👤</span>
            <input type="text" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <span class="icon-left">✉️</span>
            <input type="email" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <div class="input-wrapper">
            <span class="icon-left">📞</span>
            <input type="tel" placeholder="Enter your phone number">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <span class="icon-left">🔒</span>
            <input type="password" id="signup-pass" placeholder="Create a password" required>
            <span class="toggle-pw" onclick="togglePassword('signup-pass')">👁️</span>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <span class="icon-left">🔒</span>
            <input type="password" id="signup-confirm-pass" placeholder="Confirm your password" required>
            <span class="toggle-pw" onclick="togglePassword('signup-confirm-pass')">👁️</span>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-block"><a href="index.html">signup</a></button>
      </form>

      <p class="auth-switch">Already have an account? <a href="#index.html" id="switch-to-signin">Sign in</a></p>
    </div>
  </div>

  <script src="sign up.js"></script>
</body>
</html>
