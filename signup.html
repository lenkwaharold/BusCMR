<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusCMR - Sign Up</title>
    <link rel='stylesheet' href='css/style.css'>
    <!-- Font Awesome for Input Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body class="auth-body">

    <!-- Form Card Centered on Screen -->
    <div class="card auth-card">
        <!-- Logo Section -->
        <div class="brand-logo">
            <h1>Bus<span>CMR</span></h1>
            <p class="tagline">Book. Travel. Arrive.</p>
        </div>

        <!-- Header -->
        <div class="auth-header">
            <h2 class="page-title">Create Your Account</h2>
            <p class="auth-subtitle">Sign up to get started with BusCMR</p>
        </div>

        <!-- Form -->
        <form id="signupForm" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope field-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone field-icon"></i>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Create a password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                </div>
            </div>

            <div class="form-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn btn-primary">Sign Up</button>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="link-bold">Sign in</a></p>
            </div>
        </form>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleSignUp(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            const newUser = { fullName, email, phone, password };
            let users = JSON.parse(localStorage.getItem('buscmr_users')) || [];
            
            const userExists = users.some(u => u.email === email);
            if (userExists) {
                alert("An account with this email already exists!");
                return;
            }

            users.push(newUser);
            localStorage.setItem('buscmr_users', JSON.stringify(users));

            alert("Account created successfully!");
            window.location.href = "login.html";
        }
    </script>
    <script src='js/signup.js'></script>

</body>
</html>
